name: Build Windows app

# Runs on every push to main, on version tags (v0.2.0, v0.3.0 …) and on demand.
# 1. installs the libraries on a real Windows machine
# 2. runs the self-test with the real app window (screenshots are kept)
# 3. builds "SubZeroAstro.exe" with PyInstaller and self-tests the .exe too
# 4. releases only: signs SubZeroAstro.exe through SignPath (once SIGNPATH_* settings exist)
# 5. uploads the zipped app; for version tags it also creates a GitHub Release
#
# Code signing (free for open source, SignPath Foundation) - see README "Code signing policy".
# Needs, under Settings > Secrets and variables > Actions:
#   secret   SIGNPATH_API_TOKEN          (SignPath > your user > API token, for a CI user)
#   variable SIGNPATH_ORGANIZATION_ID    (SignPath > Organization settings)
#   variable SIGNPATH_PROJECT_SLUG       (optional, default "SubZeroAstro")
#   variable SIGNPATH_POLICY_SLUG        (optional, default "release-signing")
# Without SIGNPATH_ORGANIZATION_ID the build runs exactly as before, unsigned.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub Release with this version tag (e.g. v0.2.0). Leave empty for a test build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90           # a signing request waits for the manual approval in SignPath
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Self-test (Python, real window)
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          mkdir -p selftest_python
          python subzeroastro.py --selftest selftest_python 2>&1 | tee selftest_python/console.txt
          exit ${PIPESTATUS[0]}

      - name: Build SubZeroAstro.exe
        run: |
          python build_version.py
          pyinstaller --noconfirm --clean --windowed --name "SubZeroAstro" --version-file version_info.txt subzeroastro.py

      - name: Self-test (the built .exe)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\SubZeroAstro\SubZeroAstro.exe" -ArgumentList "--selftest", "$PWD\selftest_exe" -Wait -PassThru
          Get-Content selftest_exe\selftest_result.txt
          if ($p.ExitCode -ne 0) { throw "exe self-test failed with exit code $($p.ExitCode)" }

      - name: Upload the unsigned app for signing (releases only)
        id: upload-unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != '' && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != '')
        uses: actions/upload-artifact@v4
        with:
          name: SubZeroAstro-unsigned
          path: dist

      - name: Sign SubZeroAstro.exe (SignPath Foundation)
        id: sign
        if: steps.upload-unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'SubZeroAstro' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use the signed app
        if: steps.sign.outcome == 'success'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path signed -Recurse -Filter SubZeroAstro.exe | Select-Object -First 1
          if (-not $exe) { throw "signed SubZeroAstro.exe not found" }
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "Signature: $($sig.Status) - $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "signature is not valid: $($sig.Status)" }
          Copy-Item $exe.FullName "dist\SubZeroAstro\SubZeroAstro.exe" -Force

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md "dist\SubZeroAstro\README.md"
          Copy-Item LICENSE "dist\SubZeroAstro\LICENSE.txt"
          Compress-Archive -Path "dist\SubZeroAstro" -DestinationPath "SubZeroAstro-Windows.zip"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: SubZeroAstro-Windows
          path: SubZeroAstro-Windows.zip

      - name: Upload self-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-screenshots
          path: |
            selftest_python
            selftest_exe

      - name: Publish self-test results to the selftest-results branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results
          cp -r selftest_python selftest_exe results/ 2>/dev/null || true
          echo "commit ${{ github.sha }}  run ${{ github.run_id }}  $(date -u)" > results/RUN.txt
          cd results
          git init -q -b selftest-results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Self-test results for ${{ github.sha }}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" selftest-results

      - name: Create release (version tags, or a release_tag given when run by hand)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          $pre = @()
          if ($env:TAG -match 'beta|rc|alpha') { $pre = @('--prerelease') }
          gh release create "$env:TAG" SubZeroAstro-Windows.zip --target "${{ github.sha }}" @pre `
            --title "SubZeroAstro $env:TAG" `
            --notes "Download SubZeroAstro-Windows.zip below, unzip it anywhere, and run 'SubZeroAstro.exe' inside the folder. From subs to masters - zero hassle. No Python needed. If Windows SmartScreen warns, click More info -> Run anyway. Free code signing provided by SignPath.io, certificate by SignPath Foundation (when signed)."

  build-mac:
    # The same app for Macs with Apple silicon (M1/M2/M3/M4), built and self-tested on a real Mac.
    # Unsigned for now: the first time, right-click SubZeroAstro.app > Open (see the README).
    needs: build
    if: always()
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Self-test (Python, real window)
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          mkdir -p selftest_mac
          python subzeroastro.py --selftest selftest_mac 2>&1 | tee selftest_mac/console.txt
          exit ${PIPESTATUS[0]}

      - name: Build SubZeroAstro.app
        run: |
          pyinstaller --noconfirm --clean --windowed --name "SubZeroAstro" \
            --osx-bundle-identifier io.github.bapoteet.subzeroastro subzeroastro.py
          VER=$(python -c "import re;print(re.search(r'^APP_VERSION = \"([^\"]+)\"', open('subzeroastro.py').read(), re.M).group(1))")
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VER%% *}" dist/SubZeroAstro.app/Contents/Info.plist || true
          codesign --force --deep --sign - dist/SubZeroAstro.app   # ad-hoc signature (needed on Apple silicon)

      - name: Self-test (the built app)
        run: |
          dist/SubZeroAstro.app/Contents/MacOS/SubZeroAstro --selftest "$PWD/selftest_mac_app"
          cat selftest_mac_app/selftest_result.txt

      - name: Package
        run: |
          cp README.md LICENSE dist/
          cd dist && ditto -c -k --sequesterRsrc --keepParent SubZeroAstro.app ../SubZeroAstro-macOS-AppleSilicon.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: SubZeroAstro-macOS-AppleSilicon
          path: SubZeroAstro-macOS-AppleSilicon.zip

      - name: Publish self-test results to the selftest-results-mac branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results
          cp -r selftest_mac selftest_mac_app results/ 2>/dev/null || true
          echo "commit ${{ github.sha }}  run ${{ github.run_id }}  $(date -u)" > results/RUN.txt
          cd results
          git init -q -b selftest-results-mac
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Mac self-test results for ${{ github.sha }}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" selftest-results-mac

      - name: Add the Mac app to the release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: gh release upload "$TAG" SubZeroAstro-macOS-AppleSilicon.zip --clobber
